[package]
name = "rearguard-godot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib: the GDExtension library Godot loads. rlib: so unit tests can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "0.3"
# Pinned exactly: gdext 0.5.5 is the newest release, its MSRV (1.94) matches our pinned
# toolchain, and `api-4-7` targets the pinned Godot 4.7.2 (see README.md).
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }
rearguard-core.workspace = true
zeroize = { version = "1.9", default-features = false }

[lints]
workspace = true
