[package]
name = "rearguard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chacha20 = { version = "0.10", default-features = false, features = ["rng", "zeroize"] }
hkdf = "0.13"
libm = "0.2"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name = "probe"
harness = false
