[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libm = "0.2"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
rearguard-core.workspace = true
rearguard-sim = { path = "../rearguard-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1.9", default-features = false }

[lints]
workspace = true
