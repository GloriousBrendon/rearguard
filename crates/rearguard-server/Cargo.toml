[package]
name = "rearguard-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
rearguard-core.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
zeroize = { version = "1.9", default-features = false }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
rearguard-sim = { path = "../rearguard-sim" }
