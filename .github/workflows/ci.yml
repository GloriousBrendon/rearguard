name: CI

# Runs on every branch push; PRs from this repo show these runs as their checks.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Proves the GDExtension library (.so / .dll) itself builds on both platforms.
      - name: Build the Godot extension
        run: cargo build --locked -p rearguard-godot

  # Dependency policy. Linux only: cargo-deny and cargo tree evaluate the lockfile
  # graph for every target platform, so the result is the same on any host OS.
  policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (advisories, bans, licences, sources)
        run: cargo deny --locked check
      - name: No Godot crates outside rearguard-godot
        run: scripts/check-no-godot.sh

  # Every first-party source file starts with the SPDX header (decision D3). Linux only:
  # it reads the tracked files, which are the same on any host.
  headers:
    name: licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX header in every first-party source file
        run: scripts/check-spdx.sh

  # Headless GDScript tests for demo/, with the Rust extension (crates/rearguard-godot)
  # built and required. The same suite runs on Windows in `godot-windows`. To bump Godot,
  # change the pinned version and checksums in every job together (see demo/README.md,
  # "CI"); the cache keys include them, so a bump downloads afresh.
  godot:
    name: godot tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
      # SHA-512 of Godot_v${GODOT_VERSION}_linux.x86_64.zip, from the release's SHA512-SUMS.txt.
      GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-godot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-godot-${{ runner.os }}-
      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ZIP_SHA512 }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl
          curl -sSfL --retry 3 -o ~/godot-dl/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
      # Checked on every run, cache hit or not; a mismatch fails the job.
      - name: Verify checksum and unpack
        run: |
          echo "${GODOT_ZIP_SHA512}  ${HOME}/godot-dl/godot.zip" | sha512sum --check --strict
          mkdir -p ~/godot
          unzip -q -o ~/godot-dl/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          ~/godot/godot --version
      # Import before building the extension: with a GDExtension class registered, Godot
      # 4.7.2's first headless import segfaults while shutting down (gdext 0.5.5; any
      # class triggers it, and later runs are unaffected). See crates/rearguard-godot/README.md.
      # The cargo cache may hold a library from an earlier run, so remove it first; the
      # build step below puts it back.
      - name: Import project
        run: |
          rm -f target/debug/librearguard_godot.so
          timeout 300 ~/godot/godot --headless --path demo --import
      # demo/rearguard.gdextension loads target/debug/librearguard_godot.so; the live-loop
      # tests (demo/scripts/live_loop_test.gd) run target/debug/rearguard-server.
      - name: Build the Godot extension and the server
        run: cargo build --locked -p rearguard-godot -p rearguard-server
      - name: Run tests
        # Extension tests fail (instead of skipping) if the library did not load.
        env:
          REARGUARD_REQUIRE_EXTENSION: "1"
        run: timeout 600 ~/godot/godot --headless --path demo --fixed-fps 120 --script res://tests/run_tests.gd

  # The same headless GDScript suite on Windows (task 1.9a), then the release build of the
  # extension DLL for the study export. Git Bash, so the steps match the Linux job.
  godot-windows:
    name: godot tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2-stable
      # SHA-512 of Godot_v${GODOT_VERSION}_win64.exe.zip, from the release's SHA512-SUMS.txt.
      GODOT_WIN_ZIP_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-godot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-godot-${{ runner.os }}-
      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_WIN_ZIP_SHA512 }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl
          curl -sSfL --retry 3 -o ~/godot-dl/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
      # Checked on every run, cache hit or not; a mismatch fails the job. The console
      # wrapper prints to the job log.
      - name: Verify checksum and unpack
        run: |
          echo "${GODOT_WIN_ZIP_SHA512}  ${HOME}/godot-dl/godot.zip" | sha512sum --check --strict
          7z x -y -o"${HOME}/godot" ~/godot-dl/godot.zip > /dev/null
          # The console wrapper finds the editor by its own name, so both keep theirs.
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"
          ~/godot/Godot_v${GODOT_VERSION}_win64_console.exe --version
      # Import before building, as on Linux (first-import crash, crates/rearguard-godot/README.md).
      - name: Import project
        run: |
          rm -f target/debug/rearguard_godot.dll
          timeout 300 "$GODOT_BIN" --headless --path demo --import
      - name: Build the Godot extension and the server
        run: cargo build --locked -p rearguard-godot -p rearguard-server
      - name: Run tests
        env:
          REARGUARD_REQUIRE_EXTENSION: "1"
        run: timeout 900 "$GODOT_BIN" --headless --path demo --fixed-fps 120 --script res://tests/run_tests.gd
      # The study export (job `study-build`) packs this DLL into the Windows build.
      - name: Build the release extension
        run: cargo build --release --locked -p rearguard-godot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rearguard-godot-windows-release
          path: target/release/rearguard_godot.dll
          if-no-files-found: error
          retention-days: 3

  # The human-study build (task 1.9a): exports Linux and Windows builds with the release
  # templates, a fresh study key per run, and smoke-tests the Linux build. See
  # docs/study/facilitator-instructions.md.
  study-build:
    name: study build (export, linux smoke)
    needs: godot-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      # SHA-512 of Godot_v${GODOT_VERSION}_export_templates.tpz, from the release's SHA512-SUMS.txt.
      GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-study-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-study-${{ runner.os }}-
      - name: Cache Godot downloads
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-study-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ZIP_SHA512 }}-${{ env.GODOT_TEMPLATES_SHA512 }}
      - name: Download Godot and the export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -sSfL --retry 3 -o ~/godot-dl/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL --retry 3 -o ~/godot-dl/templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
      # Both checked on every run, cache hit or not; a mismatch fails the job. Only the two
      # release templates the study uses are unpacked.
      - name: Verify checksums and unpack
        run: |
          echo "${GODOT_ZIP_SHA512}  ${HOME}/godot-dl/godot.zip" | sha512sum --check --strict
          echo "${GODOT_TEMPLATES_SHA512}  ${HOME}/godot-dl/templates.tpz" | sha512sum --check --strict
          mkdir -p ~/godot ~/templates
          unzip -q -o ~/godot-dl/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          unzip -q -o -j ~/godot-dl/templates.tpz templates/linux_release.x86_64 templates/windows_release_x86_64.exe -d ~/templates
          ~/godot/godot --version
          cat <(unzip -p ~/godot-dl/templates.tpz templates/version.txt)
      # demo/ is imported for the export check the smoke test runs with the editor.
      - name: Import project
        run: |
          rm -f target/debug/librearguard_godot.so
          timeout 300 ~/godot/godot --headless --path demo --import
      - name: Build the release extension and the key tool
        run: cargo build --locked --release -p rearguard-godot && cargo build --locked -p rearguard-server
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rearguard-godot-windows-release
          path: target/release
      # A fresh key per run: every run's builds are a release of their own. The key is
      # never printed; the facilitator downloads it from the study-key artifact.
      - name: Create this release's study key
        run: |
          echo "STUDY_RELEASE=r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/key"
          target/debug/rearguard-server gen-secret "$RUNNER_TEMP/key/study-key.hex"
      - name: Export the Linux and Windows builds
        run: |
          scripts/export-study.sh --godot ~/godot/godot --templates ~/templates \
            --study-key "$RUNNER_TEMP/key/study-key.hex" --release "$STUDY_RELEASE" \
            --out "$RUNNER_TEMP/out" --keep-build "$RUNNER_TEMP/build"
          printf '%s\n' "$STUDY_RELEASE" > "$RUNNER_TEMP/key/release.txt"
      # The editor runs the export check with the extension; this is the library the Linux
      # build ships.
      - name: Smoke test the Linux build
        run: |
          mkdir -p target/debug
          cp target/release/librearguard_godot.so target/debug/
          scripts/smoke-study-build.sh --build "$RUNNER_TEMP/build/linux" --godot ~/godot/godot \
            --key "$RUNNER_TEMP/key/study-key.hex" --release "$STUDY_RELEASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-build-linux
          path: ${{ runner.temp }}/out/rearguard-study-*-linux-x86_64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-build-windows
          path: ${{ runner.temp }}/out/rearguard-study-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-build-sizes
          path: ${{ runner.temp }}/out/build-sizes.md
      # The facilitator's copy of the key packed into this run's builds. Never send it to
      # participants; see docs/study/facilitator-instructions.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-key-facilitator-only
          path: ${{ runner.temp }}/key/
          if-no-files-found: error

  # Runs the exported Windows build on Windows: launch, decline, no files; then a
  # self-test export checked like task 1.9's.
  study-smoke-windows:
    name: study build (windows smoke)
    needs: study-build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_WIN_ZIP_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_WIN_ZIP_SHA512 }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl
          curl -sSfL --retry 3 -o ~/godot-dl/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
      - name: Verify checksum and unpack
        run: |
          echo "${GODOT_WIN_ZIP_SHA512}  ${HOME}/godot-dl/godot.zip" | sha512sum --check --strict
          7z x -y -o"${HOME}/godot" ~/godot-dl/godot.zip > /dev/null
          # The console wrapper finds the editor by its own name, so both keep theirs.
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"
          ~/godot/Godot_v${GODOT_VERSION}_win64_console.exe --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: study-build-windows
          path: ${{ runner.temp }}/dl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: study-key-facilitator-only
          path: ${{ runner.temp }}/key
      - name: Unpack the build
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          7z x -y -obuild dl/rearguard-study-*-windows-x86_64.zip > /dev/null
          ls -l build/*
      # Import with no extension present, then give the editor the build's own DLL for
      # the export check.
      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path demo --import
      - name: Smoke test the Windows build
        run: |
          t="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p target/debug
          cp "$t"/build/rearguard-study-*/rearguard_godot.dll target/debug/
          scripts/smoke-study-build.sh --build "$(echo "$t"/build/rearguard-study-*)" \
            --godot "$GODOT_BIN" --key "$t/key/study-key.hex" \
            --release "$(tr -d '\r\n' < "$t/key/release.txt")"
