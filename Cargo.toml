[workspace]
resolver = "3"
members = [
    "crates/rearguard-core",
    "crates/rearguard-sim",
    "crates/rearguard-server",
    "crates/rearguard-godot",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rearguard-core = { path = "crates/rearguard-core" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
