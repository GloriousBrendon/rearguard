; Export presets for the human-study build (task 1.9a). scripts/export-study.sh copies this
; into a staging copy of demo/ and fills in the @...@ template paths; it is not used from
; demo/ itself. Release templates only: no debug build is ever distributed.

[preset.0]

name="Linux"
platform="Linux"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.txt, *.json, *.hex"
exclude_filter="*_test.gd, dev_overlay.gd, res://tests/*, res://tools/*, README.md"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release="@LINUX_TEMPLATE@"
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.txt, *.json, *.hex"
exclude_filter="*_test.gd, dev_overlay.gd, res://tests/*, res://tools/*, README.md"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release="@WINDOWS_TEMPLATE@"
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
ssh_remote_deploy/enabled=false
